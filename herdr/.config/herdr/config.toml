onboarding = false

[keys]
prefix = "ctrl+a"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
detach = "prefix+q"
workspace_picker = "prefix+w"
new_tab = "prefix+c"
close_pane = "prefix+x"
split_vertical = "prefix+v"
split_horizontal = "prefix+-"
zoom = "prefix+z"
toggle_sidebar = "prefix+b"
previous_agent = "prefix+ctrl+p"
next_agent = "prefix+ctrl+n"
focus_agent = "prefix+alt+1..9"

[keys.indexed]
tabs = "alt"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.pick"
description = "fuzzy-switch workspace"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "synchronize-panes.broadcast"
description = "broadcast a command to all panes in this tab"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "sessionizer.agents"
description = "jump to an agent (picker)"

[ui]
mouse_capture = false
sidebar_width = 32
tab_bar_right = [
  { type = "command", command = "/home/alex/.config/herdr/status.sh", interval_seconds = 900, timeout_seconds = 5 },
  { type = "datetime", format = "%a %H:%M" },
]

[ui.toast]
delivery = "system"
delay_seconds = 2

[ui.sound]
enabled = true

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[experimental]
pane_history = false

[advanced]
scrollback_limit_bytes = 2000000
