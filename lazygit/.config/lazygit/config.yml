git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
os:
  editPreset: nvim
  open: xdg-open {{filename}}
  openLink: xdg-open {{link}}
keybinding:
  universal:
    suspendApp: <disabled>
customCommands:
  - key: "<c-z>"
    description: "Pick AI commit"
    command: 'f=$(git rev-parse --git-path COMMIT_EDITMSG) && echo "{{.Form.Msg}}" > "$f" && nvim "$f" && [ -s "$f" ] && git commit -F "$f" || echo "Commit message is empty, commit aborted."'
    context: "files"
    prompts:
      - type: "menuFromCommand"
        title: "AI Commits"
        key: "Msg"
        command: "ai-commit-msgs"
        filter: '^(?P<number>\d+)\.\s(?P<message>.+)$'
        valueFormat: "{{ .message }}"
        labelFormat: "{{ .number }}: {{ .message | green }}"
    output: terminal
  - key: "<c-t>"
    description: "Open working tree diff in diffnav"
    command: "git diff HEAD | diffnav"
    context: "files"
    output: terminal
  - key: "<c-t>"
    description: "Open commit diff in diffnav"
    command: "git show --format= {{.SelectedCommit.Hash}} | diffnav"
    context: "commits"
    output: terminal
  - key: "<c-t>"
    description: "Open branch diff vs parent (PR base or default branch) in diffnav"
    command: >-
      b={{.SelectedLocalBranch.Name}}; base=$(gh pr view "$b" --json baseRefName -q .baseRefName 2>/dev/null) || base=$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's@^origin/@@'); git diff "origin/$base...$b" | diffnav
    context: "localBranches"
    output: terminal
