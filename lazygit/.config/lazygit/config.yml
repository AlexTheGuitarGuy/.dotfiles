git:
  paging:
    colorArg: always
    pager: delta --paging=never

gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
authorColors:
  '*': '#b4befe'

os:
  editPreset: nvim

customCommands:
  - key: "<c-z>"
    description: "Pick AI commit"
    command: 'echo "{{.Form.Msg}}" > .git/COMMIT_EDITMSG && nvim .git/COMMIT_EDITMSG && [ -s .git/COMMIT_EDITMSG ] && git commit -F .git/COMMIT_EDITMSG || echo "Commit message is empty, commit aborted."'
    context: "files"
    subprocess: true
    prompts:
      - type: "menuFromCommand"
        title: "AI Commits"
        key: "Msg"
        command: "bun x @m7medvision/lazycommit@latest"
        filter: '^(?P<number>\d+)\.\s(?P<message>.+)$'
        valueFormat: "{{ .message }}"
        labelFormat: "{{ .number }}: {{ .message | green }}"
  - key: "<c-t>"
    description: "Open working tree diff in diffnav"
    command: "git diff HEAD | diffnav"
    context: "files"
    subprocess: true
  - key: "<c-t>"
    description: "Open commit diff in diffnav"
    command: "git show --format= {{.SelectedLocalCommit.Sha}} | diffnav"
    context: "commits"
    subprocess: true
  - key: "<c-t>"
    description: "Open branch diff vs parent (PR base or default branch) in diffnav"
    command: >-
      b={{.SelectedLocalBranch.Name}};
      base=$(gh pr view "$b" --json baseRefName -q .baseRefName 2>/dev/null)
      || base=$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's@^origin/@@');
      git diff "origin/$base...$b" | diffnav
    context: "localBranches"
    subprocess: true
